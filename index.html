<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yangyang's Science Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-lg">
      <h1 class="text-3xl font-bold">🧪 Yangyang's Science Explorer</h1>
      <p class="mt-1 text-indigo-100">Primary 5 Science • Answering Technique Practice</p>
    </header>

    <!-- Question Card -->
    <main class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 space-y-4">
      <div class="inline-block px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold uppercase tracking-wide">
        Systems • Heat Energy
      </div>
      
      <h2 class="text-xl font-bold text-slate-800">Practice Question 1</h2>
      <p class="text-slate-600 leading-relaxed">
        An iron spoon and a wooden spoon are placed into a mug of hot soup ($80^\circ\text{C}$). 
        After 3 minutes, why does the iron spoon feel hotter to touch than the wooden spoon?
      </p>

      <!-- Answering Area -->
      <div class="space-y-2">
        <label for="answer" class="block text-sm font-semibold text-slate-700">Type your answer below:</label>
        <textarea id="answer" rows="4" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="State your Claim, Evidence, and Scientific Reason..."></textarea>
      </div>

      <button onclick="checkKeywords()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">
        Check My Answer (Keyword Scan)
      </button>

      <!-- Feedback Zone -->
      <div id="feedback" class="hidden p-4 rounded-xl text-sm font-medium"></div>
    </main>
  </div>

  <script>
    function checkKeywords() {
      const input = document.getElementById('answer').value.toLowerCase();
      const feedback = document.getElementById('feedback');
      
      const keywords = [
        { key: 'conductor', label: 'Good conductor of heat' },
        { key: 'gained heat', label: 'Gained heat faster' },
        { key: 'faster', label: 'Rate of heat transfer' }
      ];

      let found = [];
      let missing = [];

      keywords.forEach(item => {
        if (input.includes(item.key)) {
          found.push(item.label);
        } else {
          missing.push(item.label);
        }
      });

      feedback.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-amber-100', 'text-amber-800');

      if (missing.length === 0) {
        feedback.classList.add('bg-emerald-100', 'text-emerald-800');
        feedback.innerHTML = '🎉 **Excellent!** You included all key MOE concept words!';
      } else {
        feedback.classList.add('bg-amber-100', 'text-amber-800');
        feedback.innerHTML = `💡 **Good try!** Make sure to include these key phrases: <br>• Missing: <b>${missing.join(', ')}</b>`;
      }
    }
  </script>
</body>
</html>
